name: Daily BioBio Radio Scrapper

on:
  schedule:
    - cron: '0 11,18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers and OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        run: node scraper.js

      - name: Uploading news to Github Pages
        run: |
          git config --global user.name "Alexa Scraper Bot"
          git config --global user.email "actions@github.com"
          git add feed.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "System: News daily update" && git push)